<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
        }
        .card {
            text-align: center;
            padding: 2.5rem;

        p { color: #94a3b8; margin: 0; }

<body>
    <div class="card">
        <h1>Hello, World! 🚀</h1>
        <p>Deployed seamlessly on Northflank via Docker.</p>
